name: probe2
on:
  push:
    paths:
      - '.github/workflows/probe2.yml'
jobs:
  probe:
    runs-on: macos-15
    steps:
      - name: Probe
        run: |
          set +e
          echo "=== which ==="
          which shortcuts; echo "which_exit=$?"
          echo "=== help ==="
          /usr/bin/shortcuts --help 2>&1 | head -60
          echo "=== sign help ==="
          /usr/bin/shortcuts sign --help 2>&1 | head -30
          echo "=== all done ==="
