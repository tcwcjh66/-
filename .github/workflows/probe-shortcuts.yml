name: probe-shortcuts
on:
  push:
    paths:
      - '.github/workflows/probe-shortcuts.yml'
jobs:
  probe:
    runs-on: macos-15
    steps:
      - name: Probe shortcuts CLI
        run: |
          echo "--- binary ---"
          ls -l /usr/bin/shortcuts || echo "missing"
          echo "--- help ---"
          /usr/bin/shortcuts --help 2>&1 | head -40 || true
          echo "--- sign help ---"
          /usr/bin/shortcuts sign --help 2>&1 | head -40 || true
          echo "--- try sign a minimal shortcut ---"
          cat > /tmp/mini.shortcut <<'PL'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>WFWorkflowClientVersion</key><string>1200</string>
  <key>WFWorkflowMinimumClientVersionString</key><string>900</string>
  <key>WFWorkflowMinimumClientVersion</key><integer>900</integer>
  <key>WFWorkflowIcon</key>
  <dict>
    <key>WFWorkflowIconStartColor</key><integer>4281559399</integer>
    <key>WFWorkflowIconGlyphNumber</key><integer>59751</integer>
  </dict>
  <key>WFWorkflowTypes</key><array/>
  <key>WFWorkflowActions</key>
  <array>
    <dict>
      <key>WFWorkflowActionIdentifier</key><string>is.workflow.actions.openurl</string>
      <key>WFWorkflowActionParameters</key>
      <dict>
        <key>WFInput</key>
        <dict>
          <key>Value</key>
          <dict>
            <key>string</key><string>twfit://sync?hr=80&amp;steps=1000</string>
            <key>WFSerializationType</key><string>WFTextTokenString</string>
          </dict>
          <key>WFSerializationType</key><string>WFTextTokenAttachment</string>
        </dict>
      </dict>
    </dict>
  </array>
</dict>
</plist>
PL
          /usr/bin/shortcuts sign --mode anyone --input /tmp/mini.shortcut --output /tmp/mini-signed.shortcut 2>&1 | head -20 || true
          ls -l /tmp/mini-signed.shortcut || echo "sign failed"
