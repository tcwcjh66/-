name: probe3
on:
  push:
    paths:
      - '.github/workflows/probe3.yml'
jobs:
  p:
    runs-on: macos-15
    steps:
      - name: Probe and sign
        run: |
          set +e
          {
            echo "== which =="
            which shortcuts
            echo "== help =="
            /usr/bin/shortcuts --help 2>&1 | head -50
            echo "== sign help =="
            /usr/bin/shortcuts sign --help 2>&1 | head -30
          } > /tmp/out.txt 2>&1
          echo "" | base64 -d > /tmp/mini.shortcut
          echo "== input ==" >> /tmp/out.txt
          ls -l /tmp/mini.shortcut >> /tmp/out.txt
          /usr/bin/shortcuts sign --mode anyone --input /tmp/mini.shortcut --output /tmp/mini-signed.shortcut >> /tmp/out.txt 2>&1
          echo "sign_exit=$?" >> /tmp/out.txt
          echo "== output ==" >> /tmp/out.txt
          ls -l /tmp/mini-signed.shortcut >> /tmp/out.txt 2>&1
          cp /tmp/out.txt out.txt
          cp /tmp/mini-signed.shortcut mini-signed.shortcut 2>/dev/null
          echo END
      - uses: actions/upload-artifact@v4
        with:
          name: probe3-out
          path: |
            out.txt
            mini-signed.shortcut
          if-no-files-found: warn
