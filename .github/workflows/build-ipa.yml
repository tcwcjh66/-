name: build-ipa

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      lite:
        description: "不带 Watch/Widget 扩展的瘦包（免费签名装不上时用）"
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "using $NEWEST"
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          if command -v xcodegen >/dev/null 2>&1; then xcodegen --version; else brew install xcodegen; fi

      - name: Apply lite config
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.lite }}
        run: |
          python3 scripts/lite_project.py
          head -40 project.yml

      - name: Generate Xcode project
        run: |
          ls -la
          xcodegen generate
          ls -la

      - name: Build iOS app
        run: |
          set -o pipefail
          xcodebuild -project TianCaiWei.xcodeproj \
            -target TianCaiWei \
            -sdk iphoneos \
            -configuration Release \
            SYMROOT="$(pwd)/out" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | tail -60

      - name: Package ipa
        run: |
          APP="out/Release-iphoneos/TianCaiWei.app"
          ls -la "$APP" || (echo "no app bundle" && exit 1)
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry TianCaiWei-unsigned.ipa Payload
          ls -la TianCaiWei-unsigned.ipa

      - name: Upload ipa
        uses: actions/upload-artifact@v4
        with:
          name: TianCaiWei-unsigned-ipa
          path: TianCaiWei-unsigned.ipa
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
