name: TianCaiWei
options:
  bundleIdPrefix: com.tiancaiwei
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    SWIFT_OPTIMIZATION_LEVEL: "-O"
    # CI 会用命令行覆盖这三个：版本随提交走，构建号用 run number，commit 前 7 位写进包
    MARKETING_VERSION: "3.52"
    CURRENT_PROJECT_VERSION: "1"
    TW_COMMIT: "local"

targets:
  TianCaiWei:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - target: TianCaiWeiWatch
      - target: TianCaiWeiWidget
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 天才威
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        TWCommit: "$(TW_COMMIT)"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIViewControllerBasedStatusBarAppearance: true
        NSMotionUsageDescription: 用于读取 iPhone 运动芯片的实时步数、距离与爬楼层数。
        NSCameraUsageDescription: 用于拍摄食物照片并识别其中的热量与营养。
        NSPhotoLibraryUsageDescription: 用于从相册选择餐食照片进行识别。
        NSPhotoLibraryAddUsageDescription: 用于把训练成绩单存进相簿。
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        NSHealthShareUsageDescription: 用于读取手表回传的心率、HRV、睡眠与训练记录。
        UIBackgroundModes:
          - audio
        CFBundleURLTypes:
          - CFBundleURLName: com.tiancaiwei.live
            CFBundleURLSchemes: [twfit]
        # 解锁 iPhone 上 CoreAnimation 的 60fps 上限，配合 TimelineView 跑满刷新率
        CADisableMinimumFrameDurationOnPhone: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tiancaiwei.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"

  TianCaiWeiWatch:
    type: application
    platform: watchOS
    sources:
      - path: WatchApp
    info:
      path: WatchApp/Info.plist
      properties:
        CFBundleDisplayName: 天才威
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        TWCommit: "$(TW_COMMIT)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.tiancaiwei.app
        NSMotionUsageDescription: 用于读取手表运动芯片的实时步数。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tiancaiwei.app.watchkitapp
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.tiancaiwei.app

  TianCaiWeiWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: 天才威
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tiancaiwei.app.widget
        SKIP_INSTALL: "YES"
        APPLICATION_EXTENSION_API_ONLY: "YES"

  TianCaiWeiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      # 只编被测的两个纯逻辑文件，不拉主 App，避免把 Watch/Widget 扩展一起拉进模拟器
      - path: App/Services/FoodOCR.swift
      - path: App/Data/FoodBase.swift
      - path: App/Services/FoodLearn.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tiancaiwei.app.tests
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "5.9"
        CODE_SIGNING_ALLOWED: "NO"

schemes:
  TianCaiWeiTests:
    build:
      targets:
        TianCaiWeiTests: all
    test:
      targets:
        - TianCaiWeiTests
